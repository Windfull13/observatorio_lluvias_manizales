name: Backend CI/CD
on:
  workflow_dispatch:
  push:
    branches: [develop, qa, main]
    paths: ['backend/**', '.github/workflows/backend.yml']

env:
  AWS_REGION: us-east-2
  EB_APP: observatorio-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'pdn' || (github.ref_name == 'qa' && 'qa' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Empaquetar
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          mkdir bundle
          cp target/*.jar bundle/application.jar
          echo "web: java -Xmx400m -Dserver.port=5000 -jar application.jar" > bundle/Procfile
          cd bundle && zip -r ../deploy.zip .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Desplegar en Elastic Beanstalk
        env:
          EB_ENV: ${{ vars.EB_ENV_NAME }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET=elasticbeanstalk-$AWS_REGION-$ACCOUNT
          VERSION=${GITHUB_SHA::8}-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT
          aws s3 cp backend/deploy.zip s3://$BUCKET/$EB_APP/$VERSION.zip
          aws elasticbeanstalk create-application-version --application-name $EB_APP --version-label $VERSION --source-bundle S3Bucket=$BUCKET,S3Key=$EB_APP/$VERSION.zip
          aws elasticbeanstalk update-environment --environment-name $EB_ENV --version-label $VERSION
          aws elasticbeanstalk wait environment-updated --environment-names $EB_ENV --version-label $VERSION
      - name: Smoke test
        if: ${{ vars.API_URL != '' }}
        run: curl -f --retry 10 --retry-delay 15 --retry-all-errors "${{ vars.API_URL }}/actuator/health"