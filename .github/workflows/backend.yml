name: Backend CI/CD
on:
  workflow_dispatch:
  push:
    branches: [develop, qa, main]
    paths: ['backend/**', '.github/workflows/backend.yml']

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: observatorio-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'pdn' || (github.ref_name == 'qa' && 'qa' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build y push de la imagen
        run: |
          case "$GITHUB_REF_NAME" in
            main) TAG=pdn ;;
            qa)   TAG=qa ;;
            *)    TAG=dev ;;
          esac
          IMG=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build -t $IMG:$TAG -t $IMG:$GITHUB_SHA ./backend
          docker push $IMG:$TAG
          docker push $IMG:$GITHUB_SHA
      - name: Smoke test
        if: ${{ vars.API_URL != '' }}
        run: curl -f --retry 20 --retry-delay 15 --retry-all-errors "${{ vars.API_URL }}/actuator/health"